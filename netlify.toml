[build]
  command = "npm run build"
  publish = "dist"

# La app es una sola página: cualquier ruta la resuelve React Router en el
# navegador. Sin esta regla, entrar directo a /prospectos devuelve 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Es una herramienta interna: no se indexa ni se deja enmarcar.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
